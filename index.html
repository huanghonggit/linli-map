<!doctype html>
<html lang="zh-CN" data-type="software">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#f7f8f2" />
    <meta
      name="description"
      content="用卫星地图认地标，点图标找菜场、公园和医院，步行或骑车回家。"
    />
    <meta name="page-type" content="software" />
    <meta name="site-kind" content="software" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://server.arcgisonline.com" crossorigin />
    <link rel="preconnect" href="https://wayback.maptiles.arcgis.com" crossorigin />
    <link rel="icon" type="image/svg+xml" href="/mark.svg" />
    <title>邻里地图 · 我的周边</title>
  </head>
  <body>
    <div id="root"></div>
    <template id="opening-preview">
      <section class="opening-map" aria-label="瑞和苑卫星预览" style="position:relative;max-width:780px;margin:auto;background:#3c4f3d;color:white;text-align:center;font:600 18px/1.5 system-ui">
        <img alt="瑞和苑周边卫星底图" width="420" height="420" fetchpriority="high" style="display:block;width:100%;height:min(75dvh,580px);object-fit:contain" />
        <strong style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);padding:2px 10px;background:#244b36;border:2px solid white;border-radius:12px">瑞和苑</strong>
        <p role="status" style="margin:0;padding:8px">正在打开三维地图</p>
      </section>
    </template>
    <script>
      if (window.linliOpening) {
        const preview = document.querySelector('#opening-preview').content.cloneNode(true);
        preview.querySelector('img').src = window.linliOpening.preview;
        document.querySelector('#root').append(preview);
      }
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
